<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tycoon Empire</title>
<style>
:root{--bg:#0b1020;--panel:#141c30;--panel2:#1b2740;--line:#293752;--text:#edf3ff;--muted:#91a1bd;--green:#54d69a;--gold:#f4c66a;--red:#ff7d86;--blue:#77aaff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -20%,#24375b 0,transparent 48%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,Segoe UI,sans-serif}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 13px;color:var(--text);background:#263653;font-weight:650}button:hover{filter:brightness(1.18)}button.primary{background:var(--green);color:#082217;border:0}button.danger{background:#482832;color:#ffc5c9}.app{max-width:1240px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;background:linear-gradient(135deg,#65e2a7,#4a83ed);display:grid;place-items:center;color:#071b1b;font-size:24px;font-weight:900}.brand h1{font-size:21px;margin:0;letter-spacing:.4px}.brand small{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat,.panel,.facility{background:linear-gradient(145deg,var(--panel),#111a2c);border:1px solid var(--line);border-radius:15px}.stat{padding:15px}.stat small,.muted{color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:4px}.layout{display:grid;grid-template-columns:220px 1fr;gap:14px}.nav{padding:10px;height:max-content;position:sticky;top:12px}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);margin:3px 0}.nav button.active{background:#263653;color:white}.content{min-width:0}.panel{padding:18px;margin-bottom:14px}.panel h2{margin:0 0 4px;font-size:18px}.sub{color:var(--muted);margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.facility{padding:14px}.facility .emoji{font-size:27px}.facility h3{margin:6px 0 2px}.facility p{color:var(--muted);font-size:12px;margin:0 0 10px}.facility .row{display:flex;justify-content:space-between;gap:8px;margin:5px 0}.bar{height:7px;background:#27334b;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--green)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.notice{padding:10px 12px;border-radius:10px;background:#1c2d40;color:#bcd4f7;margin-bottom:12px}.good{color:var(--green)}.gold{color:var(--gold)}.bad{color:var(--red)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.marketrow,.ledger{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:11px 0;gap:12px}.marketrow:last-child,.ledger:last-child{border:0}.marketrow small{display:block;color:var(--muted)}.marketrow input{width:76px;background:#0c1425;border:1px solid var(--line);border-radius:7px;padding:7px;color:white}.marketrow button{padding:7px 10px}.empty{text-align:center;color:var(--muted);padding:25px}.footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}.gameover{text-align:center;padding:30px}.gameover>.emoji{font-size:52px}.gameover h2{font-size:25px}.gameover .grid{text-align:left}button:disabled{opacity:.45;cursor:not-allowed}#toastHost{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:1000;width:min(560px,calc(100% - 24px));pointer-events:none}#toastHost .notice{box-shadow:0 12px 35px #0009;border:1px solid var(--line);margin:0 0 8px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.nav{position:static;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.nav button{text-align:center;padding:8px 4px;font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.app{padding:12px}.grid{grid-template-columns:1fr}.stat strong{font-size:19px}.panel{padding:14px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">T</div><div><h1>TYCOON EMPIRE</h1><small>Build smart. Trade boldly. Rule the market.</small></div></div><div class="actions"><button id="saveBtn">Simpan</button><button id="resetBtn" class="danger">Game baru</button><button id="nextBtn" class="primary">Akhiri Hari →</button></div></header>
<section class="stats">
<div class="stat"><small>Kas perusahaan</small><strong id="cash">—</strong><small id="cashDelta">Modal awal</small></div>
<div class="stat"><small>Nilai perusahaan</small><strong id="worth">—</strong><small>Kas + aset + stok</small></div>
<div class="stat"><small>Pendapatan hari ini</small><strong id="revenue">—</strong><small>Penjualan terakhir</small></div>
<div class="stat"><small>Hari operasional</small><strong id="day">1</strong><small id="rep">Reputasi: 50</small></div>
</section>
<div id="toastHost" aria-live="polite"></div><div class="layout"><nav class="nav" id="nav">
<button class="active" data-tab="overview">▦ Ringkasan</button><button data-tab="business">▣ Bisnis</button><button data-tab="production">⚙ Produksi</button><button data-tab="market">⇄ Pasar</button><button data-tab="research">✧ Riset</button><button data-tab="finance">▤ Keuangan</button>
</nav><main class="content" id="view"></main></div>
<div class="footer">Tycoon Empire · Simulasi bisnis strategi · Progress tersimpan di browser ini</div>
</div>
<script>
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n), fmt=n=>new Intl.NumberFormat('id-ID').format(n);
const defs={farm:{name:'Pertanian',emoji:'🌾',cost:1800,upkeep:90,product:'Grain',output:24,price:18,desc:'Menghasilkan bahan pangan untuk pasar.'},mill:{name:'Penggergajian',emoji:'🪵',cost:2600,upkeep:130,product:'Lumber',output:16,price:32,desc:'Mengolah kayu menjadi material konstruksi.'},factory:{name:'Pabrik Elektronik',emoji:'🏭',cost:6200,upkeep:280,product:'Electronics',output:8,price:105,desc:'Produk bernilai tinggi dengan biaya operasi besar.'},shop:{name:'Toko Ritel',emoji:'🏬',cost:3400,upkeep:170,product:'Retail Goods',output:12,price:58,desc:'Menjual barang langsung kepada konsumen.'},lab:{name:'Laboratorium R&D',emoji:'🔬',cost:5000,upkeep:220,product:'Research',output:2,price:0,desc:'Menghasilkan poin riset setiap hari.'}};
const SAVE_KEY='tycoonEmpireSave',SAVE_VERSION=2,WIN_TARGET=100000,products=['Grain','Lumber','Electronics','Retail Goods'];
const initialState=()=>({cash:12000,day:1,rep:50,revenue:0,lastDelta:0,buildings:{farm:1,mill:0,factory:0,shop:0,lab:0},stock:{Grain:0,Lumber:0,Electronics:0,'Retail Goods':0},prices:{Grain:18,Lumber:32,Electronics:105,'Retail Goods':58},marketIndex:{Grain:1,Lumber:1,Electronics:1,'Retail Goods':1},research:0,upgrades:{},tech:{},history:[],negativeDays:0,gameOver:false,won:false,event:{label:'Pasar stabil',description:'Tidak ada gangguan besar di pasar.',product:null,multiplier:1}});
let state=initialState();
let tab='overview';
function worth(){const assets=Object.entries(state.buildings).reduce((a,[k,v])=>a+v*defs[k].cost*.65,0);const inventory=products.reduce((a,p)=>{const k=Object.keys(defs).find(x=>defs[x].product===p);return a+(state.stock[p]||0)*(state.prices[p]||defs[k].price)},0);return state.cash+assets+inventory}
function notify(msg){const host=$('#toastHost');const e=document.createElement('div');e.className='notice';e.textContent=msg;host.append(e);setTimeout(()=>e.remove(),4200)}
function save(silent=false){try{localStorage.setItem(SAVE_KEY,JSON.stringify({version:SAVE_VERSION,savedAt:new Date().toISOString(),state}));if(!silent)notify('Game berhasil disimpan.');return true}catch(e){if(!silent)notify('Penyimpanan gagal. Browser mungkin membatasi localStorage.');return false}}
function load(){try{const x=JSON.parse(localStorage.getItem(SAVE_KEY));if(!x)return;const raw=x.state&&typeof x.state==='object'?x.state:x;const base=initialState();state={...base,...raw,buildings:{...base.buildings,...(raw.buildings||{})},stock:{...base.stock,...(raw.stock||{})},prices:{...base.prices,...(raw.prices||{})},marketIndex:{...base.marketIndex,...(raw.marketIndex||{})},upgrades:{...(raw.upgrades||{})},tech:{...(raw.tech||{})},history:Array.isArray(raw.history)?raw.history.slice(0,30):[],event:{...base.event,...(raw.event||{})}}}catch(e){state=initialState();notify('Save lama tidak terbaca; game dimulai dengan data baru.')}}
function resetGame(){if(!confirm('Mulai game baru? Save lokal akan diganti.'))return;state=initialState();try{localStorage.removeItem(SAVE_KEY)}catch(e){}tab='overview';render();notify('Game baru dimulai!')}
function afterAction(){render();save(true)}
function buy(k){if(state.gameOver)return;let d=defs[k];if(state.cash<d.cost)return notify('Kas tidak cukup untuk membeli bisnis ini.');state.cash-=d.cost;state.buildings[k]++;addHistory({day:state.day,label:'Membeli '+d.name,amount:-d.cost});afterAction()}
function upgrade(k){if(state.gameOver)return;let cost=Math.round(defs[k].cost*.45*(1+(state.upgrades[k]||0)));if(!state.buildings[k])return notify('Bangun fasilitas terlebih dahulu.');if(state.cash<cost)return notify('Kas tidak cukup untuk upgrade.');state.cash-=cost;state.upgrades[k]=(state.upgrades[k]||0)+1;addHistory({day:state.day,label:'Upgrade '+defs[k].name,amount:-cost});afterAction()}
function addHistory(entry){state.history.unshift(entry);state.history=state.history.slice(0,30)}
function sell(p){if(state.gameOver)return;let q=Math.max(0,Math.min(state.stock[p]||0,Math.floor(Number($('#qty-'+key(p))?.value)||1)));if(!q)return notify('Stok tidak tersedia.');let price=state.prices[p]||10;state.stock[p]-=q;let gain=q*price;state.cash+=gain;state.revenue+=gain;state.rep=Math.min(100,state.rep+(state.tech?.[2]?2:1));addHistory({day:state.day,label:'Penjualan '+p+' ('+q+' unit)',amount:gain});afterAction()}
function key(s){return s.replace(/[^a-z]/gi,'')}
const marketEvents=[{label:'Lonjakan permintaan pangan',description:'Permintaan Grain meningkat.',product:'Grain',multiplier:1.35},{label:'Panen melimpah',description:'Harga Grain melemah.',product:'Grain',multiplier:.78},{label:'Boom konstruksi',description:'Harga Lumber meningkat.',product:'Lumber',multiplier:1.3},{label:'Krisis bahan baku',description:'Pasokan Lumber mengetat.',product:'Lumber',multiplier:1.28},{label:'Demam teknologi',description:'Permintaan Electronics melonjak.',product:'Electronics',multiplier:1.32},{label:'Kelebihan stok elektronik',description:'Harga Electronics turun.',product:'Electronics',multiplier:.8},{label:'Musim belanja',description:'Permintaan Retail Goods naik.',product:'Retail Goods',multiplier:1.3},{label:'Konsumen berhemat',description:'Belanja ritel melambat.',product:'Retail Goods',multiplier:.82}];
function rollMarketEvent(){for(const p of products)state.marketIndex[p]=Math.max(.72,Math.min(1.4,(state.marketIndex[p]||1)*(.94+Math.random()*.12)));state.event=Math.random()<.48?{...marketEvents[Math.floor(Math.random()*marketEvents.length)]}:{label:'Pasar relatif stabil',description:'Harga bergerak mengikuti kondisi pasar.',product:null,multiplier:1}}
function marketPrice(p){const k=Object.keys(defs).find(x=>defs[x].product===p);return defs[k].price*(state.marketIndex[p]||1)*(state.event?.product===p?state.event.multiplier:1)}
function tick(){if(state.gameOver)return notify('Permainan berakhir. Mulai game baru untuk bermain lagi.');rollMarketEvent();let income=0,cost=0;for(const [k,n] of Object.entries(state.buildings)){if(!n)continue;const d=defs[k];cost+=n*d.upkeep*(state.tech?.[0]?0.95:1);if(k==='lab'){state.research+=n*(1+(state.upgrades[k]||0));continue}const produced=n*d.output*(1+(state.upgrades[k]||0)*.2)*(state.tech?.[1]?1.1:1);state.stock[d.product]=(state.stock[d.product]||0)+produced;const price=state.prices[d.product]||d.price,reference=marketPrice(d.product),factor=Math.max(.08,Math.min(1.7,Math.pow(reference/price,1.15))),demand=Math.max(0,Math.floor(produced*(.78+state.rep/180)*factor)),sold=Math.min(state.stock[d.product],Math.floor(demand*.6));state.stock[d.product]-=sold;income+=sold*price}const net=income-cost;state.cash+=net;state.revenue=income;state.lastDelta=net;state.day++;state.rep=Math.max(10,Math.min(100,state.rep+(net>0?(state.tech?.[2]?2:1):-2)));state.negativeDays=state.cash<0?(state.negativeDays||0)+1:0;addHistory({day:state.day-1,label:'Operasional harian',amount:net});if(worth()>=100000){state.won=true;state.gameOver=true}else if(state.negativeDays>=3){state.gameOver=true;state.won=false}render();save(true);notify('Hari '+(state.day-1)+': '+state.event.label+' — '+state.event.description);if(state.gameOver)notify(state.won?'🏆 Menang! Valuasi perusahaan mencapai $100.000.':'Bangkrut! Kas negatif selama 3 hari berturut-turut.')}
function nav(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function render(){nav();$('#cash').textContent=money(state.cash);$('#worth').textContent=money(worth());$('#revenue').textContent=money(state.revenue);$('#day').textContent=state.day;$('#rep').textContent='Reputasi: '+state.rep+'/100';$('#cashDelta').textContent=(state.lastDelta>=0?'+':'')+money(state.lastDelta)+' hari terakhir';$('#nextBtn').disabled=!!state.gameOver;$('#nextBtn').textContent=state.gameOver?'Permainan berakhir':'Akhiri Hari →';let v=$('#view');if(state.gameOver){v.innerHTML=gameOverView();return}if(tab==='overview')v.innerHTML=overview();if(tab==='business')v.innerHTML=business();if(tab==='production')v.innerHTML=production();if(tab==='market')v.innerHTML=market();if(tab==='research')v.innerHTML=research();if(tab==='finance')v.innerHTML=finance()}
function gameOverView(){return '<section class="panel gameover"><div class="emoji">'+(state.won?'🏆':'📉')+'</div><h2>'+(state.won?'Kerajaan Bisnis Terbentuk!':'Perusahaan Bangkrut')+'</h2><p class="sub">'+(state.won?'Kamu mencapai target valuasi $100.000.':'Kas negatif selama tiga hari berturut-turut.')+'</p><h2>Valuasi akhir: '+money(worth())+'</h2><p>Hari bertahan: '+state.day+'</p><button class="primary" onclick="resetGame()">Mulai game baru</button></section>'}
function overview(){let active=Object.values(state.buildings).reduce((a,b)=>a+b,0),progress=Math.min(100,worth()/100000*100);return '<section class="panel"><h2>Selamat datang, CEO</h2><p class="sub">Target utama: valuasi perusahaan $100.000. Penjualan otomatis hanya menyerap sebagian permintaan—jual sisa stok secara manual.</p><div class="notice">💡 '+(state.event?.label||'Pasar stabil')+': '+(state.event?.description||'Tidak ada gangguan pasar.')+'</div><div class="row"><div><b>'+active+'</b><div class="muted">Fasilitas aktif</div></div><div><b>'+fmt(state.research)+'</b><div class="muted">Poin riset</div></div><div><b>'+state.rep+'/100</b><div class="muted">Reputasi</div></div></div><p class="muted">Progres target: '+progress.toFixed(1)+'%</p><div class="bar"><i style="width:'+progress+'%"></i></div></section><section class="panel"><h2>Ikhtisar perusahaan</h2><p class="sub">Kondisi operasional saat ini</p><div class="grid">'+Object.entries(defs).map(([k,d])=>'<article class="facility"><div class="emoji">'+d.emoji+'</div><h3>'+d.name+'</h3><div class="row"><span class="muted">Dimiliki</span><b>'+state.buildings[k]+'</b></div><div class="row"><span class="muted">Biaya/hari</span><b>'+money(d.upkeep*state.buildings[k])+'</b></div></article>').join('')+'</div></section>'}
function business(){return `<section class="panel"><h2>Portofolio bisnis</h2><p class="sub">Beli fasilitas baru untuk memperluas kapasitas produksi.</p><div class="grid">${Object.entries(defs).map(([k,d])=>`<article class="facility"><div class="emoji">${d.emoji}</div><h3>${d.name}</h3><p>${d.desc}</p><div class="row"><span class="muted">Harga aset</span><b class="gold">${money(d.cost)}</b></div><div class="row"><span class="muted">Biaya harian</span><b>${money(d.upkeep)}</b></div><div class="row"><span class="muted">Dimiliki</span><b>${state.buildings[k]}</b></div><button class="primary" style="width:100%;margin-top:10px" onclick="buy('${k}')">Beli fasilitas</button></article>`).join('')}</div></section>`}
function production(){return `<section class="panel"><h2>Manajemen produksi</h2><p class="sub">Upgrade fasilitas untuk meningkatkan hasil produksi sebesar 20% per level.</p><div class="grid">${Object.entries(defs).map(([k,d])=>{let n=state.buildings[k],lv=state.upgrades[k]||0,cost=Math.round(d.cost*.45*(1+lv));return `<article class="facility"><div class="emoji">${d.emoji}</div><h3>${d.name}</h3><div class="row"><span class="muted">Jumlah</span><b>${n}</b></div><div class="row"><span class="muted">Level upgrade</span><b>${lv}</b></div><div class="bar"><i style="width:${Math.min(100,lv*20)}%"></i></div><button style="width:100%" ${n===0?'disabled':''} onclick="upgrade('${k}')">Upgrade · ${money(cost)}</button></article>`}).join('')}</div></section>`}
function market(){return '<section class="panel"><h2>Pasar komoditas</h2><p class="sub">Harga berubah setiap hari. Harga jual di atas harga pasar menekan permintaan. Penjualan otomatis hanya menyerap 60% dari permintaan.</p><div class="notice">Event: '+(state.event?.label||'Pasar stabil')+' — '+(state.event?.description||'')+'</div>'+products.map(p=>'<div class="marketrow"><div><b>'+p+'</b><small>Stok: '+fmt(state.stock[p]||0)+' unit</small><small>Harga pasar: '+money(marketPrice(p))+'</small></div><div><small class="muted">Harga jual/unit</small><input id="price-'+key(p)+'" data-product="'+p+'" type="number" min="1" value="'+(state.prices[p]||10)+'" onchange="setPrice(this.dataset.product,this.value)"></div><div><small class="muted">Jual manual</small><div style="display:flex;gap:5px"><input id="qty-'+key(p)+'" type="number" min="1" value="1"><button data-product="'+p+'" onclick="sell(this.dataset.product)">Jual</button></div></div></div>').join('')+'</section>'}
function setPrice(p,v){state.prices[p]=Math.max(1,Number(v)||1);save(true)}
function research(){let costs=[30,70,130];let names=['Manajemen Efisien','Otomasi Produksi','Analisis Pasar'];let effects=['Mengurangi seluruh biaya operasional bisnis sebesar 5% setiap hari.','Meningkatkan output fasilitas produksi sebesar 10% setiap hari.','Memberi bonus reputasi +1 tambahan dari penjualan dan hari operasional yang untung.'];return `<section class="panel"><h2>Pusat riset & pengembangan</h2><p class="sub">Poin riset dihasilkan oleh Laboratorium R&D setiap hari. Bonus teknologi berlaku permanen setelah diteliti.</p><div class="notice">✧ Poin riset tersedia: <b>${fmt(state.research)}</b></div><div class="grid">${names.map((n,i)=>{let c=costs[i],done=!!state.tech?.[i];return `<article class="facility"><div class="emoji">${['📊','🤖','📈'][i]}</div><h3>${n}</h3><p>${effects[i]}</p><div class="row"><span class="muted">Biaya riset</span><b>${c} RP</b></div><button style="width:100%;margin-top:10px" ${done?'disabled':''} onclick="researchBuy(${i},${c})">${done?'Sudah diteliti':'Teliti sekarang'}</button></article>`}).join('')}</div></section>`}
function researchBuy(i,c){if(state.gameOver||state.tech?.[i])return;if(state.research<c)return notify('Poin riset belum cukup.');state.research-=c;state.tech=state.tech||{};state.tech[i]=true;addHistory({day:state.day,label:'Riset '+(i+1),amount:0});afterAction();notify('Teknologi berhasil diteliti!')}
function finance(){return `<section class="panel"><h2>Laporan keuangan</h2><p class="sub">Pantau arus kas operasional perusahaan.</p><div class="grid"><article class="facility"><small class="muted">Kas tersedia</small><h2>${money(state.cash)}</h2></article><article class="facility"><small class="muted">Valuasi perusahaan</small><h2>${money(worth())}</h2></article><article class="facility"><small class="muted">Pendapatan terakhir</small><h2>${money(state.revenue)}</h2></article></div></section><section class="panel"><h2>Riwayat transaksi</h2>${state.history.length?state.history.map(x=>`<div class="ledger"><div><b>${x.label}</b><small class="muted" style="display:block">Hari ${x.day}</small></div><b class="${x.amount>=0?'good':'bad'}">${x.amount>=0?'+':''}${money(x.amount)}</b></div>`).join(''):'<div class="empty">Belum ada transaksi. Akhiri hari untuk memulai operasional.</div>'}</section>`}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;render()}});$('#nextBtn').onclick=tick;$('#saveBtn').onclick=()=>save(false);$('#resetBtn').onclick=resetGame;load();render();setInterval(()=>save(true),15000);window.addEventListener('beforeunload',()=>save(true));
</script></body></html>
